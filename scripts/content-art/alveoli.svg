<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- Syntara: собственная схема «Альвеолы и капилляры» (лицензия: own). -->
  <!-- бронхиола -->
  <path d="M20 180h190" stroke="#94a3b8" stroke-width="34" stroke-linecap="round"/>
  <path d="M20 180h190" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
  <!-- гроздь альвеол -->
  <g fill="#fbcfe8" stroke="#f472b6" stroke-width="4">
    <circle cx="290" cy="180" r="56"/><circle cx="370" cy="110" r="52"/><circle cx="380" cy="250" r="54"/>
    <circle cx="460" cy="160" r="54"/><circle cx="470" cy="270" r="44"/><circle cx="450" cy="62" r="40"/>
    <circle cx="545" cy="210" r="46"/><circle cx="540" cy="110" r="40"/>
  </g>
  <!-- капилляры: синие приносят кровь, бедную кислородом, красные уносят кровь, богатую кислородом -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M230 120c40-30 90-40 120-20s60 50 110 30 70-30 110-10" stroke="#3b82f6"/>
    <path d="M240 236c40 10 80 40 130 30s70-60 120-50 60 40 100 30" stroke="#e5484d"/>
    <path d="M330 150c20 30 30 60 70 70s70-10 100 10" stroke="#a78bfa"/>
    <path d="M300 60c20 40 60 60 100 60" stroke="#3b82f6"/>
    <path d="M420 330c10-30 40-50 80-40" stroke="#e5484d"/>
  </g>
</svg>
