<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 380" width="672" height="380">
  <!-- Syntara: собственная схема «Два круга кровообращения» (лицензия: own). Без надписей — подпись в alt. -->
  <defs>
    <linearGradient id="lung" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#e5484d"/></linearGradient>
    <linearGradient id="body" x1="1" x2="0"><stop offset="0" stop-color="#e5484d"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e5484d"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3b82f6"/></marker>
  </defs>
  <!-- лёгкие -->
  <path d="M232 30c-34 6-48 46-40 78 4 18 26 22 44 14l24-10V36c0-6-14-8-28-6z" fill="#f9a8b4" fill-opacity=".35" stroke="#f9a8b4" stroke-width="3"/>
  <path d="M440 30c34 6 48 46 40 78-4 18-26 22-44 14l-24-10V36c0-6 14-8 28-6z" fill="#f9a8b4" fill-opacity=".35" stroke="#f9a8b4" stroke-width="3"/>
  <path d="M236 70h200" stroke="url(#lung)" stroke-width="10" stroke-linecap="round"/>
  <path d="M250 52q20 18 0 36M290 52q20 18 0 36M330 52q20 18 0 36M370 52q20 18 0 36M410 52q20 18 0 36" stroke="url(#lung)" stroke-width="3" fill="none" opacity=".8"/>
  <!-- органы тела -->
  <rect x="96" y="298" width="480" height="54" rx="27" fill="#94a3b8" fill-opacity=".14" stroke="#94a3b8" stroke-width="3"/>
  <path d="M130 325h412" stroke="url(#body)" stroke-width="10" stroke-linecap="round"/>
  <path d="M150 308q18 17 0 34M210 308q18 17 0 34M270 308q18 17 0 34M330 308q18 17 0 34M390 308q18 17 0 34M450 308q18 17 0 34M510 308q18 17 0 34" stroke="url(#body)" stroke-width="3" fill="none" opacity=".8"/>
  <!-- малый круг: правый желудочек → лёгкие → левое предсердие -->
  <path d="M304 196V128q0-30-30-30h-14" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
  <path d="M412 98h-14q-30 0-30 30v24" fill="none" stroke="#e5484d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
  <!-- большой круг: левый желудочек → органы → правое предсердие -->
  <path d="M396 222h120q36 0 36 36v24" fill="none" stroke="#e5484d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
  <path d="M120 290v-90q0-36 36-36h108" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
  <!-- сердце: правая половина (слева на схеме) — синяя, левая — красная -->
  <path d="M336 150c-14-22-66-26-70 14-4 36 30 66 70 98 40-32 74-62 70-98-4-40-56-36-70-14z" fill="#94a3b8" fill-opacity=".12" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M336 156c-14-18-56-18-60 10-3 28 24 54 60 82z" fill="#3b82f6"/>
  <path d="M336 156c14-18 56-18 60 10 3 28-24 54-60 82z" fill="#e5484d"/>
  <path d="M336 152v100" stroke="#f8fafc" stroke-width="4"/>
  <path d="M280 192h112" stroke="#f8fafc" stroke-width="3" stroke-dasharray="6 5"/>
</svg>
