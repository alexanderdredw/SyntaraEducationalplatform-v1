  - { key: system.praseodymium.details, lang: [ru, kk, en], from: 3130°C, to: 3520°C }
  - { key: system.aluminum.details, lang: [ru, kk, en], from: 2470°C, to: 2519°C }
  - {
      key: system.curie.details,
      lang: ru,
      from: Первооткрывательница радиоактивности,
      to: Исследовательница радиоактивности,
    }
  - { key: system.curie.details, lang: kk, from: Радиоактивтілік пионері, to: Радиоактивтілікті зерттеуші }
  - { key: system.curie.details, lang: en, from: Pioneer of Radioactivity, to: Researcher of Radioactivity }

# Заголовок «Значение в науке и биологии» там, где о биологии ничего нет (CHEM_MAP 3.5).
significanceTitle:
  elements: [ruthenium, palladium, silver, cadmium, tin, antimony, tellurium, xenon, zirconium]
  title:
    ru: Значение в науке и технике
    kk: Ғылым мен техникадағы маңызы
    en: Significance in Science and Technology

# Цитаты учёных (В-12): Менделеев — удалить (источник не найден); Дальтон — близко к тексту книги 1808 года;
