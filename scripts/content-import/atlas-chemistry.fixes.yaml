# Утверждённые правки к «Молекулярному атласу» (docs/CHEM_MAP.md, разделы 3.1–3.8; решения владельца
# 2026-10-27, docs/CHEM_TZ.md). Конвертер scripts/content-import/atlas-chemistry.mjs применяет их при каждом
# запуске (REQ-CHEM-01): результат в content/ руками не правится.
#
# Индексы вариантов (correct, options) — с нуля, в порядке атласа (до перестановки вариантов конвертером).

# В-8: коды тем — по IUPAC; остальные коды — id атласа.
codes:
  aluminum: aluminium
  cesium: caesium

# Названия тем (в текстах атласа везде «Йод»).
titles:
  iodine: { ru: Йод }

# Интересные факты.
facts:
  # В-3: в атласе вместо факта шаблон «X имеет атомный номер N…». До утверждения владельцем — без факта.
  omit:
    [
      carbon,
      niobium,
      molybdenum,
      technetium,
      ruthenium,
      rhodium,
      palladium,
      silver,
      cadmium,
      indium,
      tin,
      antimony,
      tellurium,
      iodine,
      xenon,
      cesium,
      barium,
      lanthanum,
      cerium,
      praseodymium,
      neodymium,
    ]
  # CHEM_MAP 3.4, 3.6: исправленные факты (KK, EN — needs_review).
  set:
    titanium:
      ru: Титан горит даже в атмосфере чистого азота.
      kk: Титан тіпті таза азот атмосферасында да жанады.
      en: Titanium burns even in an atmosphere of pure nitrogen.
    neon:
      ru: Неон даёт самое яркое свечение среди благородных газов в разрядных трубках.
      kk: Газразрядты түтіктерде неон асыл газдардың ішіндегі ең жарқын жарық береді.
      en: Neon gives the brightest glow of all noble gases in discharge tubes.
    cobalt:
      ru: Кобальт входит в витамин B12 — одно из немногих природных металлоорганических соединений, жизненно необходимое человеку.
      kk: Кобальт В12 дәруменінің құрамына кіреді — бұл адамға өте қажет, табиғатта сирек кездесетін металлорганикалық қосылыстардың бірі.
      en: Cobalt is part of vitamin B12, one of the few natural organometallic compounds and essential for humans.
    nickel:
      ru: Многие метеориты состоят из сплава железа и никеля — именно так люди впервые познакомились с металлическим железом.
      kk: Көптеген метеориттер темір мен никельдің қорытпасынан тұрады, сондықтан адамдар металл темірмен алғаш рет осылай танысқан.
      en: Many meteorites are made of an iron–nickel alloy — this is how people first came across metallic iron.
    rutherford:
      ru: Резерфорд открыл атомное ядро (1911) уже после того, как получил Нобелевскую премию (1908).
      kk: Резерфорд атом ядросын (1911) Нобель сыйлығын (1908) алғаннан кейін ашты.
      en: Rutherford discovered the atomic nucleus (1911) after he had already received the Nobel Prize (1908).
    nobel:
      ru: По распространённой версии, Нобель учредил Нобелевские премии после того, как прочитал преждевременный некролог о себе под названием «Торговец смертью мёртв».
      kk: Кең тараған нұсқа бойынша, Нобель «Өлім саудагері өлді» деген өзінің мезгілсіз қазанамасын оқығаннан кейін Нобель сыйлықтарын тағайындады.
      en: According to a popular story, Nobel created the Nobel Prizes after reading a premature obituary of himself titled "The merchant of death is dead".

# Описания тем (CHEM_MAP 3.6).
descriptions:
  curie:
    ru: Первая женщина — лауреат Нобелевской премии, исследовательница радиоактивности и первооткрывательница двух новых элементов.
    kk: Нобель сыйлығын алған алғашқы әйел, радиоактивтілікті зерттеуші және екі жаңа элементті ашушы.
    en: First woman to win a Nobel Prize, a researcher of radioactivity and discoverer of two new elements.
  hodgkin:
    ru: Британский химик, получившая Нобелевскую премию по химии 1964 года за определение структур важных биомолекул (пенициллин, витамин B12).
    kk: Британдық химик, маңызды биомолекулалардың (пенициллин, В12 дәрумені) құрылымын анықтағаны үшін 1964 жылы химия бойынша Нобель сыйлығын алды.
    en: British chemist who won the 1964 Nobel Prize in Chemistry for determining the structures of important biomolecules (penicillin, vitamin B12).

# Замены подстрок в текстах атласа: ключ, язык, было → стало (CHEM_MAP 3.5, 3.6). Не найдено — ошибка конвертера.
