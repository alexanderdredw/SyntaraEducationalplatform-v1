# Утверждённые правки к «Молекулярному атласу» (docs/CHEM_MAP.md, разделы 3.1–3.8; решения владельца
# 2026-10-27, docs/CHEM_TZ.md). Конвертер scripts/content-import/atlas-chemistry.mjs применяет их при каждом
# запуске (REQ-CHEM-01): результат в content/ руками не правится.
#
# Индексы вариантов (correct, options) — с нуля, в порядке атласа (до перестановки вариантов конвертером).

# В-8: коды тем — по IUPAC; остальные коды — id атласа.
codes:
  aluminum: aluminium
  cesium: caesium

# Названия тем (в текстах атласа везде «Йод»).
titles:
  iodine: { ru: Йод }

# Интересные факты.
facts:
  # В-3: в атласе вместо факта шаблон «X имеет атомный номер N…». До утверждения владельцем — без факта.
  omit:
    [
      carbon,
      niobium,
      molybdenum,
      technetium,
      ruthenium,
      rhodium,
      palladium,
      silver,
      cadmium,
      indium,
      tin,
      antimony,
      tellurium,
      iodine,
      xenon,
      cesium,
      barium,
      lanthanum,
      cerium,
      praseodymium,
      neodymium,
    ]
  # CHEM_MAP 3.4, 3.6: исправленные факты (KK, EN — needs_review).
  set:
    titanium:
      ru: Титан горит даже в атмосфере чистого азота.
      kk: Титан тіпті таза азот атмосферасында да жанады.
      en: Titanium burns even in an atmosphere of pure nitrogen.
    neon:
      ru: Неон даёт самое яркое свечение среди благородных газов в разрядных трубках.
      kk: Газразрядты түтіктерде неон асыл газдардың ішіндегі ең жарқын жарық береді.
      en: Neon gives the brightest glow of all noble gases in discharge tubes.
    cobalt:
      ru: Кобальт входит в витамин B12 — одно из немногих природных металлоорганических соединений, жизненно необходимое человеку.
      kk: Кобальт В12 дәруменінің құрамына кіреді — бұл адамға өте қажет, табиғатта сирек кездесетін металлорганикалық қосылыстардың бірі.
      en: Cobalt is part of vitamin B12, one of the few natural organometallic compounds and essential for humans.
    nickel:
      ru: Многие метеориты состоят из сплава железа и никеля — именно так люди впервые познакомились с металлическим железом.
      kk: Көптеген метеориттер темір мен никельдің қорытпасынан тұрады, сондықтан адамдар металл темірмен алғаш рет осылай танысқан.
      en: Many meteorites are made of an iron–nickel alloy — this is how people first came across metallic iron.
    rutherford:
      ru: Резерфорд открыл атомное ядро (1911) уже после того, как получил Нобелевскую премию (1908).
      kk: Резерфорд атом ядросын (1911) Нобель сыйлығын (1908) алғаннан кейін ашты.
      en: Rutherford discovered the atomic nucleus (1911) after he had already received the Nobel Prize (1908).
    nobel:
      ru: По распространённой версии, Нобель учредил Нобелевские премии после того, как прочитал преждевременный некролог о себе под названием «Торговец смертью мёртв».
      kk: Кең тараған нұсқа бойынша, Нобель «Өлім саудагері өлді» деген өзінің мезгілсіз қазанамасын оқығаннан кейін Нобель сыйлықтарын тағайындады.
      en: According to a popular story, Nobel created the Nobel Prizes after reading a premature obituary of himself titled "The merchant of death is dead".

# Описания тем (CHEM_MAP 3.6).
descriptions:
  # REQ-EXP-08 (docs/EXPLORE_TZ.md): согласование «Полуметалл, применяемый…»; EN — перевод RU (решение владельца 2026-10-31).
  boron:
    ru: 'Полуметалл, применяемый в стекловолокне, ядерных реакторах и удобрениях.'
    kk: 'Шыны талшықтарда, ядролық реакторларда және тыңайтқыштарда қолданылатын жартылай металл.'
    en: 'A semimetal used in fibreglass, nuclear reactors and fertilisers.'
  arsenic:
    ru: 'Полуметалл с дурной славой яда, находящий применение в микроэлектронике и спецсплавах.'
    kk: 'Микроэлектроникада және арнайы қорытпаларда қолданылатын атышулы улы жартылай металл.'
    en: 'A semimetal notorious as a poison, used in microelectronics and special alloys.'
  # Описания 22 элементов вместо шаблонных (утверждены владельцем 2026-10-29, docs/ATLAS_DESCRIPTIONS.md).
  carbon:
    ru: 'Основа всей жизни на Земле и органической химии, способная образовывать длинные цепи и кольца.'
    kk: 'Жердегі барлық тіршілік пен органикалық химияның негізі, ұзын тізбектер мен сақиналар түзе алады.'
    en: 'The basis of all life on Earth and of organic chemistry, able to form long chains and rings.'
  fluorine:
    ru: 'Самый реакционноспособный элемент, который защищает зубную эмаль и входит в состав тефлона.'
    kk: 'Ең белсенді элемент: тіс кіреукесін қорғайды және тефлон құрамына кіреді.'
    en: 'The most reactive element, which protects tooth enamel and is part of Teflon.'
  niobium:
    ru: 'Ковкий переходный металл, который используется в сверхпроводящих магнитах МРТ и жаропрочных сплавах реактивных двигателей.'
    kk: 'МРТ-ның асқын өткізгіш магниттері мен реактивті қозғалтқыштардың ыстыққа төзімді қорытпаларына арналған созылғыш өтпелі металл.'
    en: 'A ductile transition metal used in superconducting MRI magnets and heat-resistant jet engine alloys.'
  molybdenum:
    ru: 'Тугоплавкий переходный металл, который упрочняет жаропрочные стали и нужен ферментам растений и человека.'
    kk: 'Ыстыққа төзімді болаттарды беріктендіретін және өсімдіктер мен адам ферменттеріне қажет қиын балқитын өтпелі металл.'
    en: 'A refractory transition metal that strengthens heat-resistant steels and is needed by plant and human enzymes.'
  technetium:
    ru: 'Элемент с самым низким атомным номером без стабильных изотопов, применяемый в медицинской диагностике.'
    kk: 'Тұрақты изотоптары жоқ ең кіші атомдық нөмірлі элемент, медициналық диагностикада қолданылады.'
    en: 'The element with the lowest atomic number that has no stable isotopes, used in medical diagnostics.'
  ruthenium:
    ru: 'Твёрдый металл платиновой группы для износостойких электрических контактов и химических катализаторов.'
    kk: 'Тозуға төзімді электр түйіспелері мен химиялық катализаторларға арналған платина тобының қатты металы.'
    en: 'A hard platinum-group metal used in wear-resistant electrical contacts and chemical catalysts.'
  rhodium:
    ru: 'Химически инертный переходный металл для автомобильных катализаторов и блестящих ювелирных покрытий.'
    kk: 'Автомобиль катализаторлары мен жылтыр зергерлік жабындарға арналған химиялық инертті өтпелі металл.'
    en: 'A chemically inert transition metal used in car catalytic converters and shiny jewellery plating.'
  palladium:
    ru: 'Металл платиновой группы, который очищает выхлопные газы и поглощает до 900 объёмов водорода.'
    kk: 'Пайдаланылған газдарды тазартатын және 900 көлемге дейін сутекті сіңіретін платина тобының металы.'
    en: 'A platinum-group metal that cleans exhaust gases and absorbs up to 900 volumes of hydrogen.'
  silver:
    ru: 'Мягкий блестящий металл — лучший проводник тепла среди металлов, известный по украшениям и монетам.'
    kk: 'Жұмсақ жылтыр металл — металдар арасындағы жылуды ең жақсы өткізгіш, әшекейлер мен тиындардан белгілі.'
    en: 'A soft, shiny metal — the best conductor of heat among metals, known from jewellery and coins.'
  cadmium:
    ru: 'Мягкий токсичный переходный металл, который используется в никель-кадмиевых аккумуляторах и ярких жёлтых пигментах.'
    kk: 'Никель-кадмий аккумуляторлары мен ашық сары пигменттерге арналған жұмсақ улы өтпелі металл.'
    en: 'A soft, toxic transition metal used in nickel-cadmium batteries and bright yellow pigments.'
  indium:
    ru: 'Очень мягкий постпереходный металл для прозрачных проводящих покрытий сенсорных экранов.'
    kk: 'Сенсорлы экрандардың мөлдір өткізгіш жабындарына арналған өте жұмсақ постөтпелі металл.'
    en: 'A very soft post-transition metal used in transparent conductive coatings of touch screens.'
  tin:
    ru: 'Мягкий постпереходный металл, который используется в припоях, лужёных консервных банках и бронзе.'
    kk: 'Дәнекерлер, қалайыланған консерві банкалары мен қола жасауға арналған жұмсақ постөтпелі металл.'
    en: 'A soft post-transition metal used in solders, tin-plated cans and bronze.'
  antimony:
    ru: 'Блестящий серый полуметалл, который входит в антипирены и упрочняет свинцовые сплавы.'
    kk: 'Жалынға қарсы заттардың құрамына кіретін және қорғасын қорытпаларын беріктендіретін жылтыр сұр жартылай металл.'
    en: 'A shiny grey metalloid used in flame retardants and to harden lead alloys.'
  tellurium:
    ru: 'Хрупкий полуметалл, который используется в солнечных панелях на основе теллурида кадмия и в термоэлектрических охладителях.'
    kk: 'Кадмий теллуриді негізіндегі күн панельдері мен термоэлектрлік салқындатқыштарға арналған морт жартылай металл.'
    en: 'A brittle metalloid used in cadmium telluride solar panels and thermoelectric coolers.'
  iodine:
    ru: 'Фиолетово-чёрный галоген — антисептик и добавка к йодированной соли против зоба.'
    kk: 'Күлгін-қара галоген — антисептик және жемсауға қарсы йодталған тұзға қосылатын қоспа.'
    en: 'A violet-black halogen — an antiseptic and an additive to iodised salt against goitre.'
  xenon:
    ru: 'Тяжёлый благородный газ, который используется в мощных лампах, ионных двигателях космических аппаратов и для наркоза.'
    kk: 'Қуатты шамдарға, ғарыш аппараттарының иондық қозғалтқыштарына және наркозға арналған ауыр асыл газ.'
    en: 'A heavy noble gas used in powerful lamps, spacecraft ion engines and anaesthesia.'
  cesium:
    ru: 'Чрезвычайно мягкий щелочной металл, по которому атомные часы определяют секунду.'
    kk: 'Атомдық сағаттар секундты анықтайтын өте жұмсақ сілтілік металл.'
    en: 'An extremely soft alkali metal that atomic clocks use to define the second.'
  barium:
    ru: 'Мягкий щелочноземельный металл, который используется в рентгеновской «бариевой каше» и окрашивает пламя фейерверков в зелёный цвет.'
    kk: 'Рентгенде «барий ботқасы» ретінде қолданылатын және отшашу жалынын жасыл түске бояйтын жұмсақ сілтілік жер металы.'
    en: 'A soft alkaline earth metal used in the X-ray "barium meal" and to colour firework flames green.'
  lanthanum:
    ru: 'Первый из лантаноидов, применяемый в аккумуляторах гибридных автомобилей и оптических линзах.'
    kk: 'Гибридті автомобильдердің аккумуляторлары мен оптикалық линзаларда қолданылатын лантаноидтардың біріншісі.'
    en: 'The first of the lanthanides, used in hybrid car batteries and optical lenses.'
  cerium:
    ru: 'Лантаноид, оксид которого очищает выхлоп и полирует линзы, а сплав входит в кремни зажигалок.'
    kk: 'Оксиді пайдаланылған газды тазартып, линзаларды жылтырататын, ал қорытпасы оттық тастарына кіретін лантаноид.'
    en: 'A lanthanide whose oxide cleans exhaust and polishes lenses, and whose alloy is used in lighter flints.'
  praseodymium:
    ru: 'Лантаноид, который используется в мощных постоянных магнитах и в стёклах для очков сварщиков.'
    kk: 'Қуатты тұрақты магниттер мен дәнекерлеушілер көзілдірігінің шынысына арналған лантаноид.'
    en: "A lanthanide used in powerful permanent magnets and welders' goggle glass."
  neodymium:
    ru: 'Лантаноид для мощнейших в мире постоянных магнитов (NdFeB) и хирургических лазеров.'
    kk: 'Әлемдегі ең қуатты тұрақты магниттер (NdFeB) мен хирургиялық лазерлерге арналған лантаноид.'
    en: "A lanthanide used in the world's most powerful permanent magnets (NdFeB) and surgical lasers."
  curie:
    ru: Первая женщина — лауреат Нобелевской премии, исследовательница радиоактивности и первооткрывательница двух новых элементов.
    kk: Нобель сыйлығын алған алғашқы әйел, радиоактивтілікті зерттеуші және екі жаңа элементті ашушы.
    en: First woman to win a Nobel Prize, a researcher of radioactivity and discoverer of two new elements.
  hodgkin:
    ru: Британский химик, получившая Нобелевскую премию по химии 1964 года за определение структур важных биомолекул (пенициллин, витамин B12).
    kk: Британдық химик, маңызды биомолекулалардың (пенициллин, В12 дәрумені) құрылымын анықтағаны үшін 1964 жылы химия бойынша Нобель сыйлығын алды.
    en: British chemist who won the 1964 Nobel Prize in Chemistry for determining the structures of important biomolecules (penicillin, vitamin B12).
  # Решение владельца 2026-10-31 (отчёт И1, docs/EXPLORE_TZ.md, REQ-EXP-08): EN — перевод утверждённых RU-описаний
  # вместо шаблона «A versatile …», KK — исправления по смыслу (кислород, хром, никель, селен, иттрий). needs_review.
  hydrogen:
    en: 'The lightest and most abundant element in the Universe, the basis of stars and life.'
  nitrogen:
    en: 'A gas that makes up 78% of the atmosphere, the basis of proteins and nucleic acids.'
  oxygen:
    kk: 'Аэробты тыныс алу мен жану үшін қажетті, тіршілікке аса маңызды газ.'
  chlorine:
    en: 'A toxic yellow-green halogen gas, the basis of water disinfection and PVC production.'
  argon:
    en: 'The third most abundant gas in the atmosphere, completely inert; used in welding and lamps.'
  potassium:
    en: 'A vital alkali metal that regulates the heart and nerves; a key fertiliser.'
  calcium:
    en: 'The most abundant metal in the human body, the basis of bones, teeth and building materials.'
  scandium:
    en: 'A light transition metal used in aerospace alloys and high-intensity lamps.'
  titanium:
    en: 'An incredibly strong and light metal with exceptional corrosion resistance.'
  vanadium:
    en: 'A hard metal used to make ultra-strong steel alloys and powerful batteries.'
  chromium:
    kk: 'Қатты, жылтыр металл, тот баспайтын болат пен сәндік қорғаныс жабындарының негізі.'
    en: 'A hard, shiny metal, the basis of stainless steel and decorative protective coatings.'
  manganese:
    en: 'An essential element in metallurgy that makes steel hard and wear-resistant.'
  iron:
    en: 'The most important metal of human civilisation, the basis of steel and the carrier of oxygen in the blood.'
  cobalt:
    en: 'A metal "of the future", critical for electric car batteries and superhard alloys.'
  nickel:
    kk: 'Монеталарда, тот баспайтын болатта және суперқорытпаларда қолданылатын коррозияға төзімді металл.'
    en: 'A corrosion-resistant metal used in coins, stainless steel and superalloys.'
  copper:
    en: 'One of the best conductors of electricity and the first metal mastered by humans.'
  zinc:
    en: 'A protector metal used to galvanise steel and to make brass and batteries.'
  gallium:
    en: 'A metal that melts in your hand, the basis of modern semiconductor electronics.'
  germanium:
    en: 'A semiconductor that played a key role in the first transistors and in modern optics.'
  selenium:
    kk: 'Жарықты электрге айналдыра алатын фотосезімтал бейметалл.'
    en: 'A photosensitive nonmetal that can convert light into electricity.'
  bromine:
    en: 'The only nonmetal that is liquid at room temperature; highly corrosive and pungent.'
  krypton:
    en: 'A rare noble gas used in powerful lasers and energy-saving windows.'
  rubidium:
    en: 'A soft alkali metal used in atomic clocks and laser technology.'
  strontium:
    en: 'An alkaline earth metal that gives fireworks their bright red colour.'
  yttrium:
    kk: 'Лазерлер, асқын өткізгіштер және люминофорлар үшін маңызды сирек жер металы.'
    en: 'A rare-earth metal, key to lasers, superconductors and phosphors.'
  zirconium:
    en: 'A metal uniquely transparent to neutrons, the basis of nuclear fuel cladding.'

