name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres и Redis для e2e (api + web). Unit/integration-тесты поднимают свои контейнеры (Testcontainers).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntara
          POSTGRES_PASSWORD: syntara
          POSTGRES_DB: syntara
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U syntara" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://syntara:syntara@localhost:5432/syntara
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: syntara-files
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
      SESSION_SECRET: ci-only-session-secret-ci-only-session-secret-ci-only-session-secret-0001
      APP_BASE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit + integration: Testcontainers поднимает Postgres 16 и Redis 7 через Docker раннера.
      - name: Test
        run: pnpm test

      # AG-09: схема Drizzle и SQL-миграции не расходятся.
      - name: Migrations are up to date
        run: |
          pnpm --filter @syntara/db db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"

      - name: OpenAPI is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json apps/web/lib/api/schema.d.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @syntara/e2e exec playwright install --with-deps chromium

      - name: Database for e2e (migrations + seed demo)
        run: |
          pnpm db:migrate
          pnpm db:seed --set=demo

      - name: E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
