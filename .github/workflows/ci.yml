name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ручной запуск (в том числе Lighthouse CI).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Postgres и Redis для e2e (api + web). Unit/integration-тесты поднимают свои контейнеры (Testcontainers).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntara
          POSTGRES_PASSWORD: syntara
          POSTGRES_DB: syntara
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U syntara" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://syntara:syntara@localhost:5432/syntara
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: syntara-files
      # MinIO: ключ доступа — не короче 3 символов, секрет — не короче 8.
      S3_ACCESS_KEY: syntara-ci
      S3_SECRET_KEY: ci-secret
      SESSION_SECRET: ci-only-session-secret-ci-only-session-secret-ci-only-session-secret-0001
      APP_BASE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # OPT-06 (раздел 9.2 ТЗ оптимизации): в git нет генерируемых файлов и файлов больше 1 МБ (кроме эталонов).
      - name: Repository files
        run: node scripts/opt/check-repo-files.mjs

      # BR-FILE-03: настоящая проверка файлов для e2e — ClamAV и olevba (как в infra/docker-compose.yml).
      # Запускаются заранее: ClamAV скачивает базы сигнатур, пока идут lint, тесты и сборка.
      - name: ClamAV and olevba for e2e (start)
        run: |
          docker run -d --name clamav -p 3310:3310 clamav/clamav:stable
          docker build -q -t syntara-olevba infra/olevba
          docker run -d --name olevba -p 8080:8080 syntara-olevba

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # OPT-06 (раздел 9.5): неиспользуемые и неуказанные зависимости (knip).
      - name: Dependencies check
        run: pnpm deps:check

      # BR-CNT-03, BR-CNT-06: файлы базовой программы content/ (формат, картинки WEBP/PNG/JPG ≤ 300 КБ, лицензии).
      - name: Content check
        run: pnpm content:check

      # Unit + integration: Testcontainers поднимает Postgres 16 и Redis 7 через Docker раннера.
      - name: Test
        run: pnpm test

      # AG-09: схема Drizzle и SQL-миграции не расходятся.
      - name: Migrations are up to date
        run: |
          pnpm --filter @syntara/db db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"

      - name: OpenAPI is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json apps/web/lib/api/schema.d.ts

      - name: Build
        run: pnpm build

      # OPT-06 (раздел 9.1), REQ-NFR-PERF-05: JS первой загрузки каждой страницы — не больше 500 КБ (gzip).
      - name: JS budget
        run: node scripts/opt/analyze-bundle.mjs apps/web/.next --budget 500

      - name: Install Playwright browsers
        run: pnpm --filter @syntara/e2e exec playwright install --with-deps chromium

      # S3 для e2e (загрузка обложек и материалов, 7.8): у services нельзя задать команду запуска MinIO.
      - name: MinIO for e2e
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY"             cgr.dev/chainguard/minio:latest server /home/nonroot/data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
          curl -sf http://localhost:9000/minio/health/live || { docker logs minio; exit 1; }
          docker exec minio mc alias set local http://localhost:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          docker exec minio mc mb --ignore-existing "local/$S3_BUCKET"

      - name: Database for e2e (migrations + seed demo)
        run: |
          pnpm db:migrate
          pnpm db:seed --set=demo

      # Worker только с проверкой файлов (outbox → file-scan): таймеры Battle и письма сценарии ведут сами.
      - name: Worker with file checks for e2e
        env:
          WORKER_QUEUES: outbox,file-scan
          CLAMD_HOST: localhost:3310
          OLEVBA_URL: http://localhost:8080
          SMTP_URL: smtp://localhost:1025
          MAIL_FROM: noreply@syntara-edu.me
        run: |
          for i in $(seq 1 90); do docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break; sleep 5; done
          docker exec clamav clamdcheck.sh || { docker logs --tail 50 clamav; exit 1; }
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done
          curl -sf http://localhost:8080/health || { docker logs olevba; exit 1; }
          nohup pnpm --filter @syntara/worker start > worker.log 2>&1 &
          for i in $(seq 1 30); do grep -q 'worker started' worker.log && break; sleep 1; done
          grep -q 'worker started' worker.log || { cat worker.log; exit 1; }

      - name: E2E
        run: pnpm e2e

      # OPT-06, О4-8 (REQ-NFR-PERF-01/02, REQ-NFR-PERF-06): Lighthouse CI — страницы гостя и урок базового предмета
      # на production-сборке; пороги — lighthouserc.json, отчёты — артефакт lighthouse-report. Только push в main и ручной
      # запуск (решение владельца 2026-10-27), не для pull request.
      - name: Lighthouse CI
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          nohup env RATE_LIMITS_DISABLED=true pnpm --filter @syntara/api start > api-lhci.log 2>&1 &
          nohup pnpm --filter @syntara/web start > web-lhci.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/api/health >/dev/null && curl -sf -o /dev/null http://localhost:3000/ru && break; sleep 2; done
          node scripts/opt/lhci.mjs http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: e2e/lighthouse-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Worker log
        if: failure()
        run: cat worker.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
