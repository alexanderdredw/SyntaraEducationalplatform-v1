name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Postgres и Redis для e2e (api + web). Unit/integration-тесты поднимают свои контейнеры (Testcontainers).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntara
          POSTGRES_PASSWORD: syntara
          POSTGRES_DB: syntara
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U syntara" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgres://syntara:syntara@localhost:5432/syntara
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: syntara-files
      # MinIO: ключ доступа — не короче 3 символов, секрет — не короче 8.
      S3_ACCESS_KEY: syntara-ci
      S3_SECRET_KEY: ci-secret
      SESSION_SECRET: ci-only-session-secret-ci-only-session-secret-ci-only-session-secret-0001
      APP_BASE_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit + integration: Testcontainers поднимает Postgres 16 и Redis 7 через Docker раннера.
      - name: Test
        run: pnpm test

      # AG-09: схема Drizzle и SQL-миграции не расходятся.
      - name: Migrations are up to date
        run: |
          pnpm --filter @syntara/db db:generate
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"

      - name: OpenAPI is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json apps/web/lib/api/schema.d.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @syntara/e2e exec playwright install --with-deps chromium

      # S3 для e2e (загрузка обложек и материалов, 7.8): у services нельзя задать команду запуска MinIO.
      - name: MinIO for e2e
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY"             cgr.dev/chainguard/minio:latest server /home/nonroot/data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
          curl -sf http://localhost:9000/minio/health/live || { docker logs minio; exit 1; }
          docker exec minio mc alias set local http://localhost:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          docker exec minio mc mb --ignore-existing "local/$S3_BUCKET"

      - name: Database for e2e (migrations + seed demo)
        run: |
          pnpm db:migrate
          pnpm db:seed --set=demo

      - name: E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
