questions:
  - code: mendeleev-q1
    type: single_choice
    difficulty: easy
    text:
      ru: Что создал Дмитрий Менделеев?
      kk: Дмитрий Менделеев не жасады?
      en: What did Dmitri Mendeleev create?
    options:
      - text:
          ru: Периодическую таблицу
          kk: Периодтық кестені
          en: Periodic Table
        correct: true
      - text:
          ru: Микроскоп
          kk: Микроскоп
          en: Microscope
      - text:
          ru: Батарею
          kk: Батарея
          en: Battery
      - text:
          ru: Телескоп
          kk: Телескоп
          en: Telescope
