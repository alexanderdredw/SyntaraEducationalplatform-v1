questions:
  - code: q1
    type: single_choice
    difficulty: easy
    text:
      ru: Какое количество протонов содержится в ядре атома водорода?
      kk: Сутегі атомының ядросында қанша протон бар?
      en: How many protons are in the nucleus of a hydrogen atom?
    explanation:
      ru: 'Атомный номер водорода — 1, а атомный номер равен числу протонов в ядре.'
      kk: 'Сутегінің атомдық нөмірі — 1, ал атомдық нөмір ядродағы протон санына тең.'
      en: 'The atomic number of hydrogen is 1, and the atomic number equals the number of protons in the nucleus.'
    options:
      - text:
          ru: '1'
          kk: '1'
          en: '1'
        correct: true
      - text:
          ru: '0'
          kk: '0'
          en: '0'
      - text:
          ru: '2'
          kk: '2'
          en: '2'
      - text:
          ru: '3'
          kk: '3'
          en: '3'
  - code: q2
    type: single_choice
    difficulty: medium
    text:
      ru: Какой тип химической связи образует водород при соединении с неметаллами?
      kk: Сутегі бейметалдармен қосылғанда химиялық байланыстың қандай түрін түзеді?
      en: What type of chemical bond does hydrogen form with nonmetals?
    explanation:
      ru: 'С неметаллами водород образует общие электронные пары, то есть ковалентную связь, — например, в воде H₂O и метане CH₄.'
      kk: 'Бейметалдармен сутегі ортақ электрон жұптарын, яғни коваленттік байланыс түзеді — мысалы, су H₂O мен метан CH₄ молекулаларында.'
      en: 'With nonmetals, hydrogen forms shared electron pairs, that is, covalent bonds — for example, in water H₂O and methane CH₄.'
    options:
      - text:
          ru: Водородная связь
          kk: Сутектік байланыс
          en: Hydrogen bond
      - text:
          ru: Металлическая связь
          kk: Металдық байланыс
          en: Metallic bond
      - text:
          ru: Ионная связь
          kk: Иондық байланыс
          en: Ionic bond
      - text:
          ru: Ковалентная связь
          kk: Коваленттік байланыс
          en: Covalent bond
        correct: true
  - code: q3
    type: single_choice
    difficulty: medium
    text:
      ru: Какой из изотопов водорода является радиоактивным и используется в научных исследованиях?
      kk: Сутегінің қай изотопы радиоактивті және ғылыми зерттеулерде қолданылады?
      en: Which isotope of hydrogen is radioactive and used in scientific research?
    explanation:
      ru: 'У водорода три изотопа: протий, дейтерий и тритий; радиоактивен только тритий, в ядре которого два нейтрона.'
      kk: 'Сутегінің үш изотопы бар: протий, дейтерий және тритий; тек тритий радиоактивті, оның ядросында екі нейтрон бар.'
      en: 'Hydrogen has three isotopes: protium, deuterium and tritium; only tritium, with two neutrons in its nucleus, is radioactive.'
    options:
      - text:
          ru: Водород-4
          kk: Сутегі-4
          en: Hydrogen-4
      - text:
          ru: Тритий
          kk: Тритий
          en: Tritium
        correct: true
      - text:
          ru: Дейтерий
          kk: Дейтерий
          en: Deuterium
      - text:
          ru: Протий
          kk: Протий
          en: Protium
  - code: q4
    type: single_choice
    difficulty: easy
    text:
      ru: Какая степень окисления водорода в соединениях с металлами?
      kk: Металдармен қосылыстарда сутегінің тотығу дәрежесі қандай?
      en: What is the oxidation state of hydrogen in compounds with metals?
    explanation:
      ru: 'В гидридах металлов (например, NaH) водород принимает электрон от металла, поэтому его степень окисления −1, а не обычная +1.'
      kk: 'Металл гидридтерінде (мысалы, NaH) сутегі металдан электрон алады, сондықтан оның тотығу дәрежесі әдеттегі +1 емес, −1.'
      en: 'In metal hydrides (for example, NaH), hydrogen takes an electron from the metal, so its oxidation state is −1 rather than the usual +1.'
    options:
      - text:
          ru: '+2'
          kk: '+2'
          en: '+2'
      - text:
          ru: '0'
          kk: '0'
          en: '0'
      - text:
          ru: '+1'
          kk: '+1'
          en: '+1'
      - text:
          ru: −1
          kk: −1
          en: −1
        correct: true
  - code: q5
    type: single_choice
    difficulty: medium
    text:
      ru: Какой метод производства водорода использует возобновляемые источники энергии и считается экологически чистым?
      kk: Сутегін өндірудің қай әдісі жаңартылатын энергия көздерін пайдаланады және экологиялық таза болып саналады?
      en: Which method of producing hydrogen uses renewable energy sources and is considered environmentally clean?
    explanation:
      ru: '«Зелёный» водород получают электролизом воды на энергии солнца или ветра, без выбросов углекислого газа.'
      kk: '«Жасыл» сутегіні күн немесе жел энергиясымен суды электролиздеу арқылы, көмірқышқыл газын шығармай алады.'
      en: '“Green” hydrogen is produced by electrolysis of water using solar or wind power, without carbon dioxide emissions.'
    options:
      - text:
          ru: Газификация угля
          kk: Көмірді газдандыру
          en: Coal gasification
      - text:
          ru: Паровая конверсия метана
          kk: Метанды бумен конверсиялау
          en: Steam methane reforming
      - text:
          ru: Крекинг нефти
          kk: Мұнай крекингі
          en: Oil cracking
      - text:
          ru: Производство «зеленого» водорода
          kk: «Жасыл» сутегі өндірісі
          en: '"Green" hydrogen production'
        correct: true
