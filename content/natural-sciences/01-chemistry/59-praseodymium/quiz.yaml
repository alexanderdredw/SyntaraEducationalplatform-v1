questions:
  - code: q1
    type: single_choice
    difficulty: medium
    text:
      ru: Какое свойство празеодима объясняет его использование в защитных очках для сварщиков?
      kk: Празеодимнің қай қасиеті оның дәнекерлеушілердің қорғаныш көзілдіріктерінде қолданылуын түсіндіреді?
      en: Which property of praseodymium explains its use in protective goggles for welders?
    explanation:
      ru: 'Стекло с празеодимом и неодимом (дидимовое) поглощает яркое жёлтое, ультрафиолетовое и инфракрасное излучение сварки.'
      kk: 'Празеодим мен неодим қосылған (дидим) шыны дәнекерлеудің ашық сары, ультракүлгін және инфрақызыл сәулесін жұтады.'
      en: 'Glass with praseodymium and neodymium (didymium glass) absorbs the bright yellow, ultraviolet and infrared light of welding.'
    options:
      - text:
          ru: Высокая температура плавления 931°C
          kk: Балқу температурасының жоғары болуы, 931°C
          en: A high melting point of 931°C
      - text:
          ru: Ярко-зеленый цвет ионов, поглощающий вредное излучение
          kk: Зиянды сәулелерді жұтатын иондарының ашық жасыл түсі
          en: The bright green colour of its ions that absorbs harmful radiation
      - text:
          ru: Парамагнетизм, позволяющий отклонять световые лучи
          kk: Жарық сәулелерін ауытқытатын парамагнетизмі
          en: Paramagnetism that deflects light rays
      - text:
          ru: Способность образовывать дидимовое стекло, фильтрующее УФ и ИК излучение
          kk: Ультракүлгін және инфрақызыл сәулелерді сүзетін дидим шынысын түзу қабілеті
          en: Forming didymium glass that filters UV and IR radiation
        correct: true
  - code: q2
    type: single_choice
    difficulty: medium
    text:
      ru: Сколько нейтронов содержится в ядре самого распространенного стабильного изотопа празеодима?
      kk: Празеодимнің ең көп таралған тұрақты изотопының ядросында қанша нейтрон бар?
      en: How many neutrons are in the nucleus of the most common stable isotope of praseodymium?
    explanation:
      ru: 'Единственный стабильный изотоп — празеодим-141; нейтронов 141 − 59 = 82.'
      kk: 'Жалғыз тұрақты изотоп — празеодим-141; нейтрондар саны 141 − 59 = 82.'
      en: 'The only stable isotope is praseodymium-141; it has 141 − 59 = 82 neutrons.'
    options:
      - text:
          ru: 59 и 82
          kk: 59 және 82
          en: 59 and 82
      - text:
          ru: '82'
          kk: '82'
          en: '82'
        correct: true
      - text:
          ru: '59'
          kk: '59'
          en: '59'
      - text:
          ru: '141'
          kk: '141'
          en: '141'
  - code: q3
    type: single_choice
    difficulty: easy
    text:
      ru: Какая степень окисления является наиболее стабильной для празеодима в соединениях?
      kk: Қосылыстардағы празеодим үшін қай тотығу дәрежесі ең тұрақты?
      en: Which oxidation state is the most stable for praseodymium in compounds?
    explanation:
      ru: 'Как и большинство лантаноидов, празеодим чаще всего отдаёт три электрона и образует ион Pr³⁺ с зелёными солями.'
      kk: 'Көптеген лантаноидтар сияқты празеодим көбінесе үш электрон беріп, жасыл тұздары бар Pr³⁺ ионын түзеді.'
      en: 'Like most lanthanides, praseodymium usually gives away three electrons and forms the Pr³⁺ ion, whose salts are green.'
    options:
      - text:
          ru: '+3'
          kk: '+3'
          en: '+3'
        correct: true
      - text:
          ru: '+4'
          kk: '+4'
          en: '+4'
      - text:
          ru: '+1'
          kk: '+1'
          en: '+1'
      - text:
          ru: '+2'
          kk: '+2'
          en: '+2'
  - code: q4
    type: single_choice
    difficulty: easy
    text:
      ru: Какой тип частицы образуется, когда атом празеодима теряет три электрона?
      kk: Празеодим атомы үш электронын жоғалтқанда қандай бөлшек түзіледі?
      en: Which particle forms when a praseodymium atom loses three electrons?
    explanation:
      ru: 'Потеряв три электрона, атом празеодима становится ионом Pr³⁺.'
      kk: 'Үш электронын жоғалтқан празеодим атомы Pr³⁺ ионына айналады.'
      en: 'Having lost three electrons, a praseodymium atom becomes the Pr³⁺ ion.'
    options:
      - text:
          ru: Нейтральный атом с измененной электронной конфигурацией
          kk: Электрондық конфигурациясы өзгерген бейтарап атом
          en: A neutral atom with a changed electron configuration
      - text:
          ru: Изотоп с меньшим числом протонов
          kk: Протондары азырақ изотоп
          en: An isotope with fewer protons
      - text:
          ru: Анион с зарядом -3
          kk: Заряды -3 анион
          en: An anion with a charge of -3
      - text:
          ru: Катион с зарядом +3
          kk: Заряды +3 катион
          en: A cation with a charge of +3
        correct: true
  - code: q5
    type: single_choice
    difficulty: medium
    text:
      ru: Какое свойство празеодима позволяет отнести его к металлам?
      kk: Празеодимнің қай қасиеті оны металдарға жатқызуға мүмкіндік береді?
      en: Which property of praseodymium makes it a metal?
    explanation:
      ru: 'Хорошая проводимость тепла и тока, блеск и ковкость — признаки металлов, и празеодим ими обладает.'
      kk: 'Жылу мен токты жақсы өткізу, жылтыр және созылғыштық — металдардың белгілері, және празеодимде олар бар.'
      en: 'Good conduction of heat and electricity, luster and malleability are signs of metals, and praseodymium has them.'
    options:
      - text:
          ru: Наличие 59 протонов в ядре
          kk: Ядросында 59 протонның болуы
          en: Having 59 protons in the nucleus
      - text:
          ru: Реакция с галогенами с образованием галогенидов
          kk: Галогендермен әрекеттесіп, галогенидтер түзуі
          en: Reacting with halogens to form halides
      - text:
          ru: Хорошая электро- и теплопроводность
          kk: Электр мен жылуды жақсы өткізуі
          en: Good electrical and thermal conductivity
        correct: true
      - text:
          ru: Способность образовывать зеленые ионы
          kk: Жасыл иондар түзу қабілеті
          en: The ability to form green ions
