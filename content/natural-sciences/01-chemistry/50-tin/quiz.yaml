questions:
  - code: q1
    type: single_choice
    difficulty: easy
    text:
      ru: Какое количество протонов содержится в ядре атома олова?
      kk: Қалайы атомының ядросында қанша протон бар?
      en: How many protons are in the nucleus of a tin atom?
    explanation:
      ru: 'Атомный номер олова — 50, значит, в ядре пятьдесят протонов.'
      kk: 'Қалайының атомдық нөмірі — 50, демек, ядросында елу протон бар.'
      en: 'The atomic number of tin is 50, so its nucleus contains fifty protons.'
    options:
      - text:
          ru: '70'
          kk: '70'
          en: '70'
      - text:
          ru: '120'
          kk: '120'
          en: '120'
      - text:
          ru: '100'
          kk: '100'
          en: '100'
      - text:
          ru: '50'
          kk: '50'
          en: '50'
        correct: true
  - code: q2
    type: single_choice
    difficulty: easy
    text:
      ru: Какой химический символ соответствует олову?
      kk: Қалайыға қай химиялық таңба сәйкес келеді?
      en: Which chemical symbol corresponds to tin?
    explanation:
      ru: 'Символ Sn происходит от латинского названия олова — stannum.'
      kk: 'Sn таңбасы қалайының латынша атауынан — stannum сөзінен шыққан.'
      en: 'The symbol Sn comes from the Latin name of tin — stannum.'
    options:
      - text:
          ru: Ti
          kk: Ti
          en: Ti
      - text:
          ru: Sn
          kk: Sn
          en: Sn
        correct: true
      - text:
          ru: St
          kk: St
          en: St
      - text:
          ru: Ol
          kk: Ol
          en: Ol
  - code: q3
    type: single_choice
    difficulty: medium
    text:
      ru: Какая электронная конфигурация соответствует атому олова?
      kk: Қалайы атомына қай электрондық конфигурация сәйкес келеді?
      en: Which electron configuration corresponds to the tin atom?
    explanation:
      ru: 'У олова 50 электронов: 36 как у криптона, заполненная 4d¹⁰, затем 5s² и два электрона на 5p.'
      kk: 'Қалайының 50 электроны бар: 36-сы криптондағыдай, толтырылған 4d¹⁰, содан кейін 5s² және 5p-да екі электрон.'
      en: 'Tin has 50 electrons: 36 as in krypton, a filled 4d¹⁰, then 5s² and two electrons in 5p.'
    options:
      - text:
          ru: '[Xe] 4d¹⁰ 5s² 5p²'
          kk: '[Xe] 4d¹⁰ 5s² 5p²'
          en: '[Xe] 4d¹⁰ 5s² 5p²'
      - text:
          ru: '[Kr] 4d¹⁰ 5s² 5p⁶'
          kk: '[Kr] 4d¹⁰ 5s² 5p⁶'
          en: '[Kr] 4d¹⁰ 5s² 5p⁶'
      - text:
          ru: '[Kr] 4d¹⁰ 5s² 5p²'
          kk: '[Kr] 4d¹⁰ 5s² 5p²'
          en: '[Kr] 4d¹⁰ 5s² 5p²'
        correct: true
      - text:
          ru: '[Kr] 4d⁸ 5s² 5p⁴'
          kk: '[Kr] 4d⁸ 5s² 5p⁴'
          en: '[Kr] 4d⁸ 5s² 5p⁴'
  - code: q4
    type: single_choice
    difficulty: medium
    text:
      ru: Какая из перечисленных аллотропных форм олова является неметаллическим порошком?
      kk: Қалайының қай аллотропиялық түрі бейметалл ұнтақ болып табылады?
      en: Which allotrope of tin is a nonmetallic powder?
    explanation:
      ru: 'На холоде белое олово превращается в серое — хрупкий неметаллический порошок («оловянная чума»).'
      kk: 'Суықта ақ қалайы сұр қалайыға — сынғыш бейметалл ұнтаққа айналады («қалайы обасы»).'
      en: 'In the cold, white tin turns into gray tin — a brittle nonmetallic powder (“tin pest”).'
    options:
      - text:
          ru: Кристаллическое олово
          kk: Кристалдық қалайы
          en: Crystalline tin
      - text:
          ru: Белое (бета) олово
          kk: Ақ (бета) қалайы
          en: White (beta) tin
      - text:
          ru: Серое (альфа) олово
          kk: Сұр (альфа) қалайы
          en: Grey (alpha) tin
        correct: true
      - text:
          ru: Жидкое олово
          kk: Сұйық қалайы
          en: Liquid tin
  - code: q5
    type: single_choice
    difficulty: medium
    text:
      ru: Какой изотоп олова является самым распространённым в природе?
      kk: Қалайының қай изотопы табиғатта ең көп таралған?
      en: Which isotope of tin is the most common in nature?
    explanation:
      ru: 'Из десяти стабильных изотопов олова больше всего в природе олова-120 — около трети.'
      kk: 'Қалайының он тұрақты изотопының ішінде табиғатта ең көбі — қалайы-120, шамамен үштен бірі.'
      en: 'Of tin’s ten stable isotopes, tin-120 is the most abundant in nature — about a third.'
    options:
      - text:
          ru: Олово-120
          kk: Қалайы-120
          en: Tin-120
        correct: true
      - text:
          ru: Олово-124
          kk: Қалайы-124
          en: Tin-124
      - text:
          ru: Олово-116
          kk: Қалайы-116
          en: Tin-116
      - text:
          ru: Олово-118
          kk: Қалайы-118
          en: Tin-118
