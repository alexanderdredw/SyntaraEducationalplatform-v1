questions:
  - code: q1
    type: single_choice
    difficulty: easy
    text:
      ru: Какое количество протонов содержится в ядре атома лантана?
      kk: Лантан атомының ядросында қанша протон бар?
      en: How many protons are in the nucleus of a lanthanum atom?
    explanation:
      ru: 'Атомный номер лантана — 57, значит, в ядре пятьдесят семь протонов.'
      kk: 'Лантанның атомдық нөмірі — 57, демек, ядросында елу жеті протон бар.'
      en: 'The atomic number of lanthanum is 57, so its nucleus contains fifty-seven protons.'
    options:
      - text:
          ru: '82'
          kk: '82'
          en: '82'
      - text:
          ru: '139'
          kk: '139'
          en: '139'
      - text:
          ru: '138'
          kk: '138'
          en: '138'
      - text:
          ru: '57'
          kk: '57'
          en: '57'
        correct: true
  - code: q2
    type: single_choice
    difficulty: medium
    text:
      ru: Какова электронная конфигурация атома лантана?
      kk: Лантан атомының электрондық конфигурациясы қандай?
      en: What is the electron configuration of a lanthanum atom?
    explanation:
      ru: 'У лантана 57 электронов: 54 как у ксенона, 6s² и один электрон на 5d (4f-оболочка у него ещё пуста).'
      kk: 'Лантанның 57 электроны бар: 54-і ксенондағыдай, 6s² және 5d-де бір электрон (4f қабаты әлі бос).'
      en: 'Lanthanum has 57 electrons: 54 as in xenon, 6s² and one electron in 5d (its 4f subshell is still empty).'
    options:
      - text:
          ru: '[Xe] 5d¹ 6s²'
          kk: '[Xe] 5d¹ 6s²'
          en: '[Xe] 5d¹ 6s²'
        correct: true
      - text:
          ru: '[Xe] 5d² 6s¹'
          kk: '[Xe] 5d² 6s¹'
          en: '[Xe] 5d² 6s¹'
      - text:
          ru: '[Xe] 4f¹ 5d¹ 6s²'
          kk: '[Xe] 4f¹ 5d¹ 6s²'
          en: '[Xe] 4f¹ 5d¹ 6s²'
      - text:
          ru: '[Xe] 4f¹ 6s²'
          kk: '[Xe] 4f¹ 6s²'
          en: '[Xe] 4f¹ 6s²'
  - code: q3
    type: single_choice
    difficulty: easy
    text:
      ru: Какая степень окисления является типичной и очень стабильной для лантана в соединениях?
      kk: Қосылыстардағы лантанға қай тотығу дәрежесі тән және өте тұрақты?
      en: Which oxidation state is typical and very stable for lanthanum in compounds?
    explanation:
      ru: 'Лантан отдаёт три внешних электрона (5d¹ 6s²) и образует устойчивый ион La³⁺, как и другие лантаноиды.'
      kk: 'Лантан үш сыртқы электронын (5d¹ 6s²) беріп, басқа лантаноидтар сияқты тұрақты La³⁺ ионын түзеді.'
      en: 'Lanthanum gives away three outer electrons (5d¹ 6s²) and forms the stable La³⁺ ion, like the other lanthanides.'
    options:
      - text:
          ru: '+2'
          kk: '+2'
          en: '+2'
      - text:
          ru: '+4'
          kk: '+4'
          en: '+4'
      - text:
          ru: '+1'
          kk: '+1'
          en: '+1'
      - text:
          ru: '+3'
          kk: '+3'
          en: '+3'
        correct: true
  - code: q4
    type: single_choice
    difficulty: medium
    text:
      ru: Какой изотоп лантана является самым распространённым стабильным изотопом?
      kk: Лантанның қай изотопы ең көп таралған тұрақты изотоп?
      en: Which isotope of lanthanum is the most common stable isotope?
    explanation:
      ru: 'Более 99 % природного лантана — стабильный лантан-139.'
      kk: 'Табиғи лантанның 99 %-дан астамы — тұрақты лантан-139.'
      en: 'More than 99% of natural lanthanum is stable lanthanum-139.'
    options:
      - text:
          ru: Лантан-138
          kk: Лантан-138
          en: Lanthanum-138
      - text:
          ru: Лантан-139
          kk: Лантан-139
          en: Lanthanum-139
        correct: true
      - text:
          ru: Лантан-140
          kk: Лантан-140
          en: Lanthanum-140
      - text:
          ru: Лантан-137
          kk: Лантан-137
          en: Lanthanum-137
  - code: q5
    type: single_choice
    difficulty: medium
    text:
      ru: Какое свойство лантана позволяет использовать его в никель-металлгидридных (NiMH) батареях для гибридных автомобилей?
      kk: Лантанның қай қасиеті оны гибридті автомобильдерге арналған никель-металл гидридті (NiMH) батареяларда пайдалануға мүмкіндік береді?
      en: Which property of lanthanum allows it to be used in nickel–metal hydride (NiMH) batteries for hybrid cars?
    explanation:
      ru: 'Сплав LaNi₅ при зарядке поглощает водород, а при разрядке отдаёт его — на этом и работает NiMH-аккумулятор.'
      kk: 'LaNi₅ қорытпасы зарядталғанда сутегіні сіңіреді, ал разрядталғанда береді — NiMH аккумуляторы осыған негізделген.'
      en: 'The LaNi₅ alloy absorbs hydrogen when charging and releases it when discharging — this is how a NiMH battery works.'
    options:
      - text:
          ru: Высокая температура плавления
          kk: Балқу температурасының жоғары болуы
          en: A high melting point
      - text:
          ru: Парамагнетизм
          kk: Парамагнетизмі
          en: Paramagnetism
      - text:
          ru: Способность образовывать гидроксид
          kk: Гидроксид түзу қабілеті
          en: The ability to form a hydroxide
      - text:
          ru: Сплав LaNi₅ обратимо поглощает водород
          kk: LaNi₅ қорытпасы сутегіні қайтымды сіңіреді
          en: The alloy LaNi₅ absorbs hydrogen reversibly
        correct: true
