questions:
  - code: q1
    type: single_choice
    difficulty: easy
    text:
      ru: Какое количество протонов содержится в ядре атома иттрия?
      kk: Иттрий атомының ядросында қанша протон бар?
      en: How many protons are in the nucleus of an yttrium atom?
    explanation:
      ru: 'Атомный номер иттрия — 39, значит, в ядре тридцать девять протонов.'
      kk: 'Иттрийдің атомдық нөмірі — 39, демек, ядросында отыз тоғыз протон бар.'
      en: 'The atomic number of yttrium is 39, so its nucleus contains thirty-nine protons.'
    options:
      - text:
          ru: '89'
          kk: '89'
          en: '89'
      - text:
          ru: '50'
          kk: '50'
          en: '50'
      - text:
          ru: '39'
          kk: '39'
          en: '39'
        correct: true
      - text:
          ru: '31'
          kk: '31'
          en: '31'
  - code: q2
    type: single_choice
    difficulty: easy
    text:
      ru: Какова типичная степень окисления иттрия в соединениях?
      kk: Қосылыстардағы иттрийдің әдеттегі тотығу дәрежесі қандай?
      en: What is the typical oxidation state of yttrium in compounds?
    explanation:
      ru: 'Иттрий отдаёт три электрона — 5s² и 4d¹ — и в соединениях, как и лантаноиды, имеет степень окисления +3.'
      kk: 'Иттрий үш электрон береді — 5s² және 4d¹ — және қосылыстарда лантаноидтар сияқты +3 тотығу дәрежесін көрсетеді.'
      en: 'Yttrium gives away three electrons — 5s² and 4d¹ — and, like the lanthanides, has an oxidation state of +3 in compounds.'
    options:
      - text:
          ru: '+1'
          kk: '+1'
          en: '+1'
      - text:
          ru: '+3'
          kk: '+3'
          en: '+3'
        correct: true
      - text:
          ru: '+4'
          kk: '+4'
          en: '+4'
      - text:
          ru: '+2'
          kk: '+2'
          en: '+2'
  - code: q3
    type: single_choice
    difficulty: medium
    text:
      ru: Какой из перечисленных изотопов иттрия является единственным стабильным природным изотопом?
      kk: Иттрийдің қай изотопы табиғаттағы жалғыз тұрақты изотоп?
      en: Which isotope of yttrium is its only stable natural isotope?
    explanation:
      ru: 'Весь природный иттрий — стабильный иттрий-89 (39 протонов и 50 нейтронов).'
      kk: 'Табиғи иттрийдің бәрі — тұрақты иттрий-89 (39 протон және 50 нейтрон).'
      en: 'All natural yttrium is stable yttrium-89 (39 protons and 50 neutrons).'
    options:
      - text:
          ru: ⁹⁰Y
          kk: ⁹⁰Y
          en: ⁹⁰Y
      - text:
          ru: ³⁹Y
          kk: ³⁹Y
          en: ³⁹Y
      - text:
          ru: ⁸⁹Y
          kk: ⁸⁹Y
          en: ⁸⁹Y
        correct: true
      - text:
          ru: ⁹¹Y
          kk: ⁹¹Y
          en: ⁹¹Y
  - code: q5
    type: single_choice
    difficulty: easy
    text:
      ru: В какой группе и периоде периодической системы находится иттрий?
      kk: Иттрий периодтық жүйенің қай тобы мен периодында орналасқан?
      en: In which group and period of the periodic table is yttrium?
    explanation:
      ru: 'Иттрий стоит под скандием в 3-й группе и открывает ряд переходных металлов 5-го периода.'
      kk: 'Иттрий 3-топта скандийдің астында тұр және 5-периодтың ауыспалы металдар қатарын бастайды.'
      en: 'Yttrium sits below scandium in group 3 and opens the series of transition metals of period 5.'
    options:
      - text:
          ru: 5-я группа, 3-й период
          kk: 5-топ, 3-период
          en: Group 5, period 3
      - text:
          ru: 3-я группа, 4-й период
          kk: 3-топ, 4-период
          en: Group 3, period 4
      - text:
          ru: 3-я группа, 5-й период
          kk: 3-топ, 5-период
          en: Group 3, period 5
        correct: true
      - text:
          ru: 4-я группа, 5-й период
          kk: 4-топ, 5-период
          en: Group 4, period 5
