questions:
  - code: q1
    type: single_choice
    difficulty: easy
    text:
      ru: Какое количество протонов содержится в ядре атома теллура?
      kk: Теллур атомының ядросында қанша протон бар?
      en: How many protons are in the nucleus of a tellurium atom?
    explanation:
      ru: 'Атомный номер теллура — 52, значит, в ядре пятьдесят два протона.'
      kk: 'Теллурдың атомдық нөмірі — 52, демек, ядросында елу екі протон бар.'
      en: 'The atomic number of tellurium is 52, so its nucleus contains fifty-two protons.'
    options:
      - text:
          ru: '78'
          kk: '78'
          en: '78'
      - text:
          ru: '52'
          kk: '52'
          en: '52'
        correct: true
      - text:
          ru: '130'
          kk: '130'
          en: '130'
      - text:
          ru: '16'
          kk: '16'
          en: '16'
  - code: q2
    type: single_choice
    difficulty: medium
    text:
      ru: Какой тип элемента представляет собой теллур согласно классификации по свойствам?
      kk: Қасиеттері бойынша жіктегенде теллур элементтің қай түріне жатады?
      en: According to its properties, what type of element is tellurium?
    explanation:
      ru: 'Теллур блестит, как металл, но хрупок и является полупроводником — это полуметалл.'
      kk: 'Теллур металл сияқты жылтырайды, бірақ сынғыш және жартылай өткізгіш — бұл жартылай металл.'
      en: 'Tellurium shines like a metal but is brittle and a semiconductor — it is a metalloid.'
    options:
      - text:
          ru: Полуметалл
          kk: Жартылай металл
          en: Metalloid
        correct: true
      - text:
          ru: Неметалл
          kk: Бейметалл
          en: Nonmetal
      - text:
          ru: Металл
          kk: Металл
          en: Metal
      - text:
          ru: Инертный газ
          kk: Инертті газ
          en: Inert gas
  - code: q3
    type: single_choice
    difficulty: medium
    text:
      ru: Какая электронная конфигурация соответствует атому теллура?
      kk: Теллур атомына қай электрондық конфигурация сәйкес келеді?
      en: Which electron configuration corresponds to the tellurium atom?
    explanation:
      ru: 'У теллура 52 электрона: 36 как у криптона, заполненная 4d¹⁰, затем 5s² и четыре электрона на 5p.'
      kk: 'Теллурдың 52 электроны бар: 36-сы криптондағыдай, толтырылған 4d¹⁰, содан кейін 5s² және 5p-да төрт электрон.'
      en: 'Tellurium has 52 electrons: 36 as in krypton, a filled 4d¹⁰, then 5s² and four electrons in 5p.'
    options:
      - text:
          ru: '[Kr] 4d¹⁰ 5s² 5p⁶'
          kk: '[Kr] 4d¹⁰ 5s² 5p⁶'
          en: '[Kr] 4d¹⁰ 5s² 5p⁶'
      - text:
          ru: '[Xe] 4f¹⁴ 5d¹⁰ 6s² 6p⁴'
          kk: '[Xe] 4f¹⁴ 5d¹⁰ 6s² 6p⁴'
          en: '[Xe] 4f¹⁴ 5d¹⁰ 6s² 6p⁴'
      - text:
          ru: '[Ar] 3d¹⁰ 4s² 4p⁴'
          kk: '[Ar] 3d¹⁰ 4s² 4p⁴'
          en: '[Ar] 3d¹⁰ 4s² 4p⁴'
      - text:
          ru: '[Kr] 4d¹⁰ 5s² 5p⁴'
          kk: '[Kr] 4d¹⁰ 5s² 5p⁴'
          en: '[Kr] 4d¹⁰ 5s² 5p⁴'
        correct: true
  - code: q4
    type: single_choice
    difficulty: medium
    text:
      ru: Какое свойство теллура подтверждает, что он является полуметаллом?
      kk: Теллурдың қай қасиеті оның жартылай металл екенін растайды?
      en: Which property of tellurium confirms that it is a metalloid?
    explanation:
      ru: 'У металлов проводимость при нагреве падает, а у теллура, как у полупроводника, растёт.'
      kk: 'Металдарда қыздырғанда өткізгіштік төмендейді, ал теллурда, жартылай өткізгіштегідей, артады.'
      en: 'In metals conductivity falls when heated, while in tellurium, as in a semiconductor, it rises.'
    options:
      - text:
          ru: Электропроводность растет с температурой
          kk: Электр өткізгіштігі температурамен бірге артады
          en: Its electrical conductivity increases with temperature
        correct: true
      - text:
          ru: Он растворяется в воде
          kk: Суда ериді
          en: It dissolves in water
      - text:
          ru: Он имеет металлический блеск
          kk: Металдық жылтыры бар
          en: It has a metallic lustre
      - text:
          ru: Он хорошо проводит тепло
          kk: Жылуды жақсы өткізеді
          en: It conducts heat well
  - code: q5
    type: single_choice
    difficulty: easy
    text:
      ru: Какая степень окисления теллура является типичной?
      kk: Теллурға қай тотығу дәрежесі тән?
      en: Which oxidation state is typical of tellurium?
    explanation:
      ru: 'Теллур, как и сера, проявляет степени окисления −2, +4 и +6; самая обычная из них — +4, например в TeO₂.'
      kk: 'Теллур күкірт сияқты −2, +4 және +6 тотығу дәрежелерін көрсетеді; олардың ең кең таралғаны — +4, мысалы TeO₂-де.'
      en: 'Like sulfur, tellurium shows oxidation states of −2, +4 and +6; the most common of them is +4, for example in TeO₂.'
    options:
      - text:
          ru: '+4'
          kk: '+4'
          en: '+4'
        correct: true
      - text:
          ru: '+1'
          kk: '+1'
          en: '+1'
      - text:
          ru: '-3'
          kk: '-3'
          en: '-3'
      - text:
          ru: '+2'
          kk: '+2'
          en: '+2'
