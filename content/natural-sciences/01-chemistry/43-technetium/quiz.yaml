questions:
  - code: q1
    type: single_choice
    difficulty: medium
    text:
      ru: Какое свойство технеция позволяет использовать его в качестве бета-излучателя для калибровки приборов?
      kk: Технецийдің қай қасиеті оны құралдарды калибрлеуге арналған бета-сәуле шығарғыш ретінде пайдалануға мүмкіндік береді?
      en: Which property of technetium allows it to be used as a beta source for calibrating instruments?
    explanation:
      ru: 'У технеция нет стабильных изотопов, все они радиоактивны, поэтому его используют как источник излучения для калибровки.'
      kk: 'Технецийдің тұрақты изотоптары жоқ, бәрі радиоактивті, сондықтан оны калибрлеу үшін сәуле көзі ретінде қолданады.'
      en: 'Technetium has no stable isotopes — all are radioactive — so it is used as a radiation source for calibration.'
    options:
      - text:
          ru: Серебристо-серый вид, похожий на платину
          kk: Платинаға ұқсас күміс-сұр түсі
          en: A silvery-grey look similar to platinum
      - text:
          ru: Способность становиться сверхпроводником при 7.46 К
          kk: 7.46 К температурада асқын өткізгішке айналу қабілеті
          en: The ability to become a superconductor at 7.46 K
      - text:
          ru: Высокая электро- и теплопроводность
          kk: Жоғары электр және жылу өткізгіштік
          en: High electrical and thermal conductivity
      - text:
          ru: 'Радиоактивность: испускает бета- и гамма-излучение'
          kk: 'Радиоактивтілігі: бета- және гамма-сәулелер шығарады'
          en: 'Radioactivity: it emits beta and gamma radiation'
        correct: true
  - code: q2
    type: single_choice
    difficulty: medium
    text:
      ru: Какой изотоп технеция имеет 55 нейтронов в ядре?
      kk: Технецийдің қай изотопының ядросында 55 нейтрон бар?
      en: Which isotope of technetium has 55 neutrons in its nucleus?
    explanation:
      ru: 'У технеция 43 протона, поэтому изотоп с 55 нейтронами имеет массовое число 43 + 55 = 98.'
      kk: 'Технецийде 43 протон бар, сондықтан 55 нейтроны бар изотоптың массалық саны 43 + 55 = 98.'
      en: 'Technetium has 43 protons, so the isotope with 55 neutrons has a mass number of 43 + 55 = 98.'
    options:
      - text:
          ru: Технеций-98
          kk: Технеций-98
          en: Technetium-98
        correct: true
      - text:
          ru: Технеций-97
          kk: Технеций-97
          en: Technetium-97
      - text:
          ru: Технеций-99m
          kk: Технеций-99m
          en: Technetium-99m
      - text:
          ru: Технеций-99
          kk: Технеций-99
          en: Technetium-99
  - code: q3
    type: single_choice
    difficulty: easy
    text:
      ru: Какая степень окисления технеция является наиболее частой, помимо +7?
      kk: +7-ден басқа технецийдің ең жиі кездесетін тотығу дәрежесі қандай?
      en: Apart from +7, which oxidation state of technetium is the most common?
    explanation:
      ru: 'Кроме высшей степени +7 (в пертехнетатах), технеций чаще всего встречается со степенью окисления +4, например в TcO₂.'
      kk: 'Ең жоғары +7 дәрежесінен (пертехнетаттарда) басқа, технеций көбінесе +4 тотығу дәрежесімен кездеседі, мысалы TcO₂-де.'
      en: 'Apart from its highest state of +7 (in pertechnetates), technetium most often occurs with an oxidation state of +4, for example in TcO₂.'
    options:
      - text:
          ru: '+1'
          kk: '+1'
          en: '+1'
      - text:
          ru: '-1'
          kk: '-1'
          en: '-1'
      - text:
          ru: '+6'
          kk: '+6'
          en: '+6'
      - text:
          ru: '+4'
          kk: '+4'
          en: '+4'
        correct: true
  - code: q4
    type: single_choice
    difficulty: medium
    text:
      ru: Почему технеций почти не применяют как ингибитор коррозии стали, хотя он эффективен?
      kk: Тиімді болса да, технеций неге болат коррозиясының ингибиторы ретінде іс жүзінде қолданылмайды?
      en: Why is technetium hardly used as a corrosion inhibitor for steel, even though it is effective?
    explanation:
      ru: 'Пертехнетаты защищают сталь от коррозии, но технеций радиоактивен, поэтому применять его в обычной технике опасно.'
      kk: 'Пертехнетаттар болатты коррозиядан қорғайды, бірақ технеций радиоактивті, сондықтан оны қарапайым техникада қолдану қауіпті.'
      en: 'Pertechnetates protect steel from corrosion, but technetium is radioactive, so using it in ordinary equipment is dangerous.'
    options:
      - text:
          ru: Из-за высокой температуры плавления
          kk: Балқу температурасы жоғары болғандықтан
          en: Because of its high melting point
      - text:
          ru: Из-за парамагнетизма
          kk: Парамагнитті болғандықтан
          en: Because it is paramagnetic
      - text:
          ru: Из-за растворимости в окисляющих кислотах
          kk: Тотықтырғыш қышқылдарда еритіндіктен
          en: Because it dissolves in oxidising acids
      - text:
          ru: Из-за радиоактивности
          kk: Радиоактивті болғандықтан
          en: Because it is radioactive
        correct: true
  - code: q5
    type: single_choice
    difficulty: medium
    text:
      ru: Какое применение технеция связано с его способностью испускать гамма-излучение?
      kk: Технецийдің қай қолданылуы оның гамма-сәуле шығару қабілетімен байланысты?
      en: Which use of technetium is related to its ability to emit gamma rays?
    explanation:
      ru: 'Гамма-лучи технеция-99m проходят сквозь тело и регистрируются камерой, что позволяет увидеть кости, сердце и другие органы.'
      kk: 'Технеций-99m гамма-сәулелері денеден өтіп, камерамен тіркеледі, бұл сүйектерді, жүректі және басқа мүшелерді көруге мүмкіндік береді.'
      en: 'Gamma rays from technetium-99m pass through the body and are recorded by a camera, which makes bones, the heart and other organs visible.'
    options:
      - text:
          ru: Изучение процессов коррозии металлов
          kk: Металдардың коррозия процестерін зерттеу
          en: Studying corrosion of metals
      - text:
          ru: Контроль потоков в химических установках
          kk: Химиялық қондырғылардағы ағындарды бақылау
          en: Monitoring flows in chemical plants
      - text:
          ru: Калибровка бета-излучателей
          kk: Бета-сәуле шығарғыштарды калибрлеу
          en: Calibrating beta sources
      - text:
          ru: 'Медицинская диагностика: визуализация костей, сердца и органов'
          kk: 'Медициналық диагностика: сүйектерді, жүректі және мүшелерді бейнелеу'
          en: 'Medical diagnostics: imaging of bones, the heart and organs'
        correct: true
