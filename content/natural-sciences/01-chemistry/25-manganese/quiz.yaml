questions:
  - code: q1
    type: single_choice
    difficulty: medium
    text:
      ru: Какое свойство марганца делает его незаменимым в металлургии для производства стали?
      kk: Марганецтің қай қасиеті оны металлургияда болат өндіру үшін таптырмас етеді?
      en: Which property of manganese makes it indispensable in steelmaking?
    explanation:
      ru: 'Марганец связывает вредную серу и кислород в стали и делает её твёрже и износостойче — альтернативы ему нет.'
      kk: 'Марганец болаттағы зиянды күкірт пен оттегіні байланыстырып, оны қатты әрі тозуға төзімді етеді — оның баламасы жоқ.'
      en: 'Manganese binds harmful sulfur and oxygen in steel and makes it harder and more wear-resistant — there is no substitute for it.'
    options:
      - text:
          ru: Увеличивает электропроводность стали
          kk: Болаттың электр өткізгіштігін арттырады
          en: It increases the electrical conductivity of steel
      - text:
          ru: Придаёт стали розоватый оттенок
          kk: Болатқа қызғылт реңк береді
          en: It gives steel a pinkish tint
      - text:
          ru: Повышает твёрдость и устойчивость к износу
          kk: Қаттылық пен тозуға төзімділікті арттырады
          en: It increases hardness and wear resistance
        correct: true
      - text:
          ru: Снижает температуру плавления стали
          kk: Болаттың балқу температурасын төмендетеді
          en: It lowers the melting point of steel
  - code: q2
    type: single_choice
    difficulty: easy
    text:
      ru: Сколько протонов содержится в ядре атома марганца?
      kk: Марганец атомының ядросында қанша протон бар?
      en: How many protons are in the nucleus of a manganese atom?
    explanation:
      ru: 'Атомный номер марганца — 25, значит, в ядре двадцать пять протонов.'
      kk: 'Марганецтің атомдық нөмірі — 25, демек, ядросында жиырма бес протон бар.'
      en: 'The atomic number of manganese is 25, so its nucleus contains twenty-five protons.'
    options:
      - text:
          ru: '55'
          kk: '55'
          en: '55'
      - text:
          ru: '30'
          kk: '30'
          en: '30'
      - text:
          ru: '7'
          kk: '7'
          en: '7'
      - text:
          ru: '25'
          kk: '25'
          en: '25'
        correct: true
  - code: q3
    type: single_choice
    difficulty: medium
    text:
      ru: Какая электронная конфигурация соответствует атому марганца в основном состоянии?
      kk: Негізгі күйдегі марганец атомына қай электрондық конфигурация сәйкес келеді?
      en: Which electron configuration corresponds to the manganese atom in its ground state?
    explanation:
      ru: 'У марганца 25 электронов: 18 как у аргона, 4s² и пять электронов на 3d.'
      kk: 'Марганецтің 25 электроны бар: 18-і аргондағыдай, 4s² және 3d-де бес электрон.'
      en: 'Manganese has 25 electrons: 18 as in argon, 4s² and five electrons in 3d.'
    options:
      - text:
          ru: '[Ar] 3d⁶ 4s¹'
          kk: '[Ar] 3d⁶ 4s¹'
          en: '[Ar] 3d⁶ 4s¹'
      - text:
          ru: '[Ar] 3d⁷ 4s⁰'
          kk: '[Ar] 3d⁷ 4s⁰'
          en: '[Ar] 3d⁷ 4s⁰'
      - text:
          ru: '[Ar] 3d⁵ 4s²'
          kk: '[Ar] 3d⁵ 4s²'
          en: '[Ar] 3d⁵ 4s²'
        correct: true
      - text:
          ru: '[Ar] 3d⁴ 4s²'
          kk: '[Ar] 3d⁴ 4s²'
          en: '[Ar] 3d⁴ 4s²'
  - code: q4
    type: single_choice
    difficulty: medium
    text:
      ru: Какое соединение марганца является мощным окислителем?
      kk: Марганецтің қай қосылысы күшті тотықтырғыш болып табылады?
      en: Which manganese compound is a powerful oxidising agent?
    explanation:
      ru: 'В KMnO₄ марганец имеет высшую степень окисления +7 и охотно отнимает электроны у других веществ — это сильный окислитель («марганцовка»).'
      kk: 'KMnO₄-те марганецтің ең жоғары тотығу дәрежесі +7, ол басқа заттардан электрондарды оңай тартып алады — бұл күшті тотықтырғыш («марганцовка»).'
      en: 'In KMnO₄ manganese has its highest oxidation state of +7 and readily takes electrons from other substances — it is a strong oxidizer (potassium permanganate).'
    options:
      - text:
          ru: Оксид марганца(II) (MnO)
          kk: Марганец(II) оксиді (MnO)
          en: Manganese(II) oxide (MnO)
      - text:
          ru: Карбонат марганца(II) (MnCO₃)
          kk: Марганец(II) карбонаты (MnCO₃)
          en: Manganese(II) carbonate (MnCO₃)
      - text:
          ru: Перманганат калия (KMnO₄)
          kk: Калий перманганаты (KMnO₄)
          en: Potassium permanganate (KMnO₄)
        correct: true
      - text:
          ru: Сульфат марганца(II) (MnSO₄)
          kk: Марганец(II) сульфаты (MnSO₄)
          en: Manganese(II) sulfate (MnSO₄)
  - code: q5
    type: single_choice
    difficulty: medium
    text:
      ru: Какое значение имеет марганец для фотосинтеза растений?
      kk: Марганецтің өсімдіктердің фотосинтезі үшін маңызы қандай?
      en: Why is manganese important for photosynthesis in plants?
    explanation:
      ru: 'Атомы марганца входят в комплекс, который при фотосинтезе расщепляет воду и выделяет кислород.'
      kk: 'Марганец атомдары фотосинтез кезінде суды ыдыратып, оттегі бөлетін кешеннің құрамына кіреді.'
      en: 'Manganese atoms are part of the complex that splits water and releases oxygen during photosynthesis.'
    options:
      - text:
          ru: Фундаментален для расщепления воды
          kk: Суды ыдырату үшін аса маңызды
          en: It is essential for splitting water
        correct: true
      - text:
          ru: Является источником энергии для хлоропластов
          kk: Хлоропластар үшін энергия көзі болып табылады
          en: It is an energy source for chloroplasts
      - text:
          ru: Обеспечивает красный цвет листьев
          kk: Жапырақтарға қызыл түс береді
          en: It makes leaves red
      - text:
          ru: Ускоряет поглощение углекислого газа
          kk: Көмірқышқыл газын сіңіруді жеделдетеді
          en: It speeds up the uptake of carbon dioxide
