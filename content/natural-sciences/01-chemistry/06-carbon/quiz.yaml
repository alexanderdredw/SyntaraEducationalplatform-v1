questions:
  - code: q1
    type: single_choice
    difficulty: easy
    text:
      ru: Какое количество протонов содержится в ядре атома углерода?
      kk: Көміртегі атомының ядросында қанша протон бар?
      en: How many protons are in the nucleus of a carbon atom?
    explanation:
      ru: 'Атомный номер углерода — 6, значит, в ядре шесть протонов.'
      kk: 'Көміртегінің атомдық нөмірі — 6, демек, ядросында алты протон бар.'
      en: 'The atomic number of carbon is 6, so its nucleus contains six protons.'
    options:
      - text:
          ru: '8'
          kk: '8'
          en: '8'
      - text:
          ru: '12'
          kk: '12'
          en: '12'
      - text:
          ru: '6'
          kk: '6'
          en: '6'
        correct: true
      - text:
          ru: '14'
          kk: '14'
          en: '14'
  - code: q2
    type: single_choice
    difficulty: easy
    text:
      ru: Какой тип химической связи преимущественно образует углерод, имея 4 валентных электрона?
      kk: 4 валенттік электроны бар көміртек көбіне химиялық байланыстың қай түрін түзеді?
      en: With 4 valence electrons, which type of chemical bond does carbon mostly form?
    explanation:
      ru: 'Углероду трудно отдать или принять четыре электрона, поэтому он образует общие электронные пары — ковалентные связи, в том числе длинные цепи и кольца.'
      kk: 'Көміртегіге төрт электрон беру немесе алу қиын, сондықтан ол ортақ электрон жұптарын — коваленттік байланыстар түзеді, соның ішінде ұзын тізбектер мен сақиналар.'
      en: 'It is hard for carbon to give or take four electrons, so it forms shared electron pairs — covalent bonds, including long chains and rings.'
    options:
      - text:
          ru: Ковалентная связь
          kk: Коваленттік байланыс
          en: Covalent bond
        correct: true
      - text:
          ru: Ионная связь
          kk: Иондық байланыс
          en: Ionic bond
      - text:
          ru: Водородная связь
          kk: Сутектік байланыс
          en: Hydrogen bond
      - text:
          ru: Металлическая связь
          kk: Металдық байланыс
          en: Metallic bond
  - code: q3
    type: single_choice
    difficulty: medium
    text:
      ru: Какая аллотропная модификация углерода является самым твердым природным веществом и диэлектриком?
      kk: Көміртектің қай аллотропиялық түрі ең қатты табиғи зат және диэлектрик болып табылады?
      en: Which allotrope of carbon is the hardest natural substance and an electrical insulator?
    explanation:
      ru: 'В алмазе каждый атом углерода прочно связан с четырьмя соседями, поэтому он очень твёрдый и не проводит ток — в отличие от графита.'
      kk: 'Алмазда әрбір көміртегі атомы төрт көршісімен берік байланысқан, сондықтан ол өте қатты және графиттен айырмашылығы, ток өткізбейді.'
      en: 'In diamond each carbon atom is firmly bonded to four neighbors, so it is very hard and, unlike graphite, does not conduct electricity.'
    options:
      - text:
          ru: Графит
          kk: Графит
          en: Graphite
      - text:
          ru: Фуллерен
          kk: Фуллерен
          en: Fullerene
      - text:
          ru: Алмаз
          kk: Алмаз
          en: Diamond
        correct: true
      - text:
          ru: Графен
          kk: Графен
          en: Graphene
  - code: q4
    type: single_choice
    difficulty: medium
    text:
      ru: Какой изотоп углерода используется для датировки археологических находок?
      kk: Археологиялық олжалардың жасын анықтау үшін көміртектің қай изотопы қолданылады?
      en: Which isotope of carbon is used to date archaeological finds?
    explanation:
      ru: 'Радиоактивный углерод-14 распадается с известной скоростью, и по его остатку определяют возраст органических находок.'
      kk: 'Радиоактивті көміртегі-14 белгілі жылдамдықпен ыдырайды, оның қалдығы бойынша органикалық олжалардың жасын анықтайды.'
      en: 'Radioactive carbon-14 decays at a known rate, and its remaining amount is used to date organic finds.'
    options:
      - text:
          ru: Углерод-14
          kk: Көміртек-14
          en: Carbon-14
        correct: true
      - text:
          ru: Углерод-13
          kk: Көміртек-13
          en: Carbon-13
      - text:
          ru: Углерод-11
          kk: Көміртек-11
          en: Carbon-11
      - text:
          ru: Углерод-12
          kk: Көміртек-12
          en: Carbon-12
  - code: q5
    type: single_choice
    difficulty: medium
    text:
      ru: Сколько нейтронов содержит самый распространенный изотоп углерода (углерод-12)?
      kk: Көміртектің ең көп таралған изотопында (көміртек-12) қанша нейтрон бар?
      en: How many neutrons does the most common isotope of carbon (carbon-12) have?
    explanation:
      ru: 'Массовое число 12 — это сумма протонов и нейтронов; протонов 6, значит, нейтронов 12 − 6 = 6.'
      kk: '12 массалық саны — протондар мен нейтрондардың қосындысы; протон 6, демек, нейтрон 12 − 6 = 6.'
      en: 'The mass number 12 is the sum of protons and neutrons; there are 6 protons, so there are 12 − 6 = 6 neutrons.'
    options:
      - text:
          ru: '6'
          kk: '6'
          en: '6'
        correct: true
      - text:
          ru: '12'
          kk: '12'
          en: '12'
      - text:
          ru: '8'
          kk: '8'
          en: '8'
      - text:
          ru: '14'
          kk: '14'
          en: '14'
