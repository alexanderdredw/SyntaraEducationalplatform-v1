# OPT-05 (О4-5): brotli для nginx с модулем ngx_brotli (load_module — в nginx.conf основного контекста).
# Подключение: файл → /etc/nginx/syntara.d/brotli.conf, web — с NEXT_COMPRESS=false (см. infra/nginx.conf).
# Клиенты без brotli получают gzip (настройки gzip — в infra/nginx.conf). SSE не сжимается: типа
# text/event-stream в списке нет.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types application/json application/javascript text/css text/plain text/xml application/xml
  image/svg+xml application/manifest+json font/ttf font/otf application/vnd.ms-fontobject;
