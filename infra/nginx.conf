# Заготовка обратного прокси (итерация 1). TLS/HSTS/CSP — итерации 3 и 11 (REQ-NFR-SEC-01).
upstream syntara_web { server web:3000; }
upstream syntara_api { server api:3001; }

server {
  listen 80;
  server_name _;
  client_max_body_size 30m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # OPT-05 (О4-5): сжатие текстовых ответов — JSON api (сам api не сжимает), HTML, CSS, JS, SVG, шрифты без
  # собственного сжатия. Ответы, уже сжатые upstream (Next.js по умолчанию gzip), nginx передаёт как есть.
  # text/event-stream в списке нет: потоки SSE (ИИ, Battle) не буферизуются сжатием.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml
    image/svg+xml application/manifest+json font/ttf font/otf application/vnd.ms-fontobject;

  # OPT-05 (О4-5): brotli — только если nginx собран с модулем ngx_brotli (в официальном образе nginx его нет).
  # Тогда положите infra/nginx-brotli.conf в /etc/nginx/syntara.d/ и запустите web с NEXT_COMPRESS=false,
  # чтобы сжимал nginx (brotli, при его отсутствии у клиента — gzip). Без файлов в каталоге строка ничего не делает.
  include /etc/nginx/syntara.d/*.conf;

  # Battle SSE (API-BTL-22/42, BATTLE_TZ 6.5): долгие потоки — без буферизации и gzip, таймаут чтения 1 ч
  # (heartbeat каждые 15 с), без Connection: close к upstream.
  location ~ ^/api/(teacher|student)/battle-sessions/[^/]+/events$ {
    proxy_pass http://syntara_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no always;
  }

  location /api/ {
    proxy_pass http://syntara_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # SSE (API-PUB-06, API-S-12): без буферизации
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # OPT-05 (О4-5): файлы сборки с хешем в имени — кешируются браузером на год без перепроверки. Next.js ставит
  # тот же заголовок; nginx заменяет его своим, чтобы заголовок был ровно один и не зависел от upstream.
  location /_next/static/ {
    proxy_pass http://syntara_web;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    proxy_pass http://syntara_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
