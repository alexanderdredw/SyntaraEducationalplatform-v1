# Заготовка обратного прокси (итерация 1). TLS/HSTS/CSP — итерации 3 и 11 (REQ-NFR-SEC-01).
upstream syntara_web { server web:3000; }
upstream syntara_api { server api:3001; }

server {
  listen 80;
  server_name _;
  client_max_body_size 30m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://syntara_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # SSE (API-PUB-06, API-S-12): без буферизации
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://syntara_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
